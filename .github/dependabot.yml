#
# Every action in the workflows under .github/workflows is pinned to a full
# commit SHA (see CI-1 in docs/plans/2026-09-26-review-tasks.md), which means
# it never updates on its own. Dependabot opens a PR to bump the SHA (and the
# version comment next to it) when a new release comes out, so pinning for
# supply-chain safety does not also mean silently falling behind on security
# fixes to the actions themselves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Cargo dependencies: the workflows only watch Actions, so a fix for an
  # advisory in a direct dependency (rustic_core, oo7) was
  # never proposed. The pop-os git dependencies are excluded: they are
  # pinned to a revision together and need a deliberate upgrade.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: libcosmic
      - dependency-name: atomicwrites
