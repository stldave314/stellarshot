# SPDX-License-Identifier: GPL-3.0-only
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build and publish packages
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            desktop-file-utils appstream

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # The metainfo's newest release must be the version being shipped, or
      # software centres advertise an old version indefinitely.
      - name: Validate metadata
        run: ./scripts/validate-metadata.sh

      - name: Test
        run: cargo test --all-features

      # A release must never ship with developer logging on, and that has to be
      # mechanical rather than remembered. install.sh passes the feature to
      # every packaging target; this proves the feature works.
      - name: Verify release-build strips debug logging
        run: ./scripts/verify-release-build.sh

      - name: Build all packages
        run: ./install.sh package

      - name: List artefacts
        run: ls -lh dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
