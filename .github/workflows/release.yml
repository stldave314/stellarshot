# SPDX-License-Identifier: GPL-3.0-only
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: read

concurrency:
  # Never canceled mid-flight: an in-progress publish must finish rather than
  # leave a tag half-released.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Read-only: builds and tests the tagged commit and uploads the packages as
  # a workflow artifact. Only `publish`, below, holds `contents: write`, so a
  # `build.rs` anywhere in the dependency tree (including a git dependency)
  # never runs with a token that could push to this repository.
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # for actions/attest-build-provenance below
      attestations: write # ditto; neither one grants push access to the repo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # tags: validate-metadata.sh checks every release has an entry
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            desktop-file-utils appstream dbus gnome-keyring rclone rpm2cpio cpio fuse3

      # The tag is what names the release and its notes; the version in
      # Cargo.toml is what names the files. They must be the same, or
      # `v0.9.0` would publish `stellarshot_0.8.2` packages under it.
      - name: Check the tag matches Cargo.toml
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${TAG#v}" != "$version" ]]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      # A fixed toolchain, not whatever stable is on the day of the tag: the
      # release is built with the compiler it was tested with. CI stays on
      # stable, to hear about a new one early. Raise this with each release
      # (see CONTRIBUTING.md, "Releasing").
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy

      # No build cache, deliberately: a release build that restores one
      # trusts whatever an earlier run left there, and a tag push is exactly
      # the run a cache-poisoning attack would aim at.

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-auditable

      # CI's own checks, repeated: a tag can be pushed on a commit CI never
      # saw, or one that has since gone red.
      - name: Clippy
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --all-targets --all-features --locked

      # The metainfo's newest release must be the version being shipped, or
      # software centers advertise an old version indefinitely.
      - name: Validate metadata
        run: ./scripts/validate-metadata.sh

      # tests/keyring.rs needs a real Secret Service and fails without one,
      # so the suite runs inside a private D-Bus session with an unlocked
      # gnome-keyring rather than skipping it.
      - name: Test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --all-features --locked
          '

      # A release must never ship with developer logging on, and that has to be
      # mechanical rather than remembered. install.sh passes the feature to
      # every packaging target; this proves the feature works.
      - name: Verify release-build strips debug logging
        run: ./scripts/verify-release-build.sh

      - name: Build all packages
        run: ./install.sh package

      # See ci.yml's own comment: proves the actual shipped files, not just
      # that the feature mechanism works in the abstract.
      - name: Verify the shipped packages strip debug logging
        run: ./scripts/verify-packaged-binaries-strip-logging.sh

      # `cargo audit bin` only lists dependencies if the binary was built
      # with `cargo auditable`; run against each package's own binary, it
      # proves all three formats got that, not just the first.
      - name: Verify the shipped binaries carry their dependency data
        run: ./scripts/verify-packaged-binaries-auditable.sh

      # For anyone without `gh`: a checksum to compare a download against.
      - name: Checksums
        run: cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS

      - name: List artifacts
        run: ls -lh dist/

      # A verifiable, signed record of exactly this GitHub Actions run
      # having produced these specific files, checkable with
      # `gh attestation verify` (documented in the README) against
      # tampering after the fact, not just against a wrong build.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.deb,dist/*.rpm,dist/*.tar.gz,dist/SHA256SUMS"

      # The release notes are the version's section of CHANGELOG.md, so the
      # release page says what changed rather than listing commits. A tag
      # with no section fails here instead of publishing an empty release.
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The same advisory, license and source checks CI runs, repeated for the
  # tagged commit: a new advisory may have landed since CI last passed.
  deny:
    name: Advisories, licenses and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The only job with `contents: write`, and the only one that touches
  # anything outside this run: it does not build anything itself, only
  # downloads what `build` already produced and tested.
  publish:
    name: Publish release
    needs: [build, deny]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only this job needs it, to create the GitHub release

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # `gh` is preinstalled on the runner, so this needs no third-party
      # action (and one fewer supply-chain dependency) for what is otherwise
      # a single API call.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS
