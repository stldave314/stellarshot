# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build, test and package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            dbus gnome-keyring rclone rpm2cpio cpio

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deb,cargo-generate-rpm

      # tests/rest_server.rs needs a real rustic-server; no prebuilt binary
      # is published, so this builds it from source like any other tool
      # this project tests against for real rather than mocking.
      - name: Install rustic-server
        run: cargo install rustic_server

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      # tests/keyring.rs needs a real Secret Service and fails without one,
      # so the suite runs inside a private D-Bus session with an unlocked
      # gnome-keyring rather than skipping it.
      - name: Test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --all-features --locked
          '

      # Proves the release feature really removes developer logging, instead of
      # trusting that the constant does what it says.
      - name: Verify release-build strips debug logging
        run: ./scripts/verify-release-build.sh

      # The same path the release workflow takes, so a packaging break shows up
      # on main rather than after a tag has been pushed.
      - name: Build packages
        run: ./install.sh package

      # verify-release-build.sh proves the mechanism (the feature strips the
      # constant); this proves the actual .deb/.rpm/.tar.gz in dist/ were
      # really built with it — a packaging target that forgot to pass the
      # feature would pass the other script without ever running.
      - name: Verify the shipped packages strip debug logging
        run: ./scripts/verify-packaged-binaries-strip-logging.sh

      - name: Inspect the .deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

  metadata:
    name: Validate packaging metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            desktop-file-utils appstream

      # Shared with local runs so the two cannot drift. Every finding from
      # desktop-file-validate and appstreamcli is a hard failure; the script
      # is deliberately not a blanket `|| true`.
      - name: Validate desktop entry and AppStream metadata
        run: ./scripts/validate-metadata.sh

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Runs offline (no GITHUB_TOKEN needed): the audits that need network
      # access are for public-repo posture checks this private-by-default
      # workflow set does not need.
      - name: Install zizmor
        run: pipx install zizmor

      - name: zizmor
        run: zizmor --min-severity medium .github/workflows

  deny:
    name: Advisories, licenses and sources
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # deny.toml's own comments explain every allow-list entry: which
      # license, which git source, which specific advisory ID, and why.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev

      # `rust-version` in Cargo.toml, kept at or above rustic_core's own
      # floor: this proves the crate actually still builds there, rather
      # than trusting the field is accurate.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check at the minimum supported Rust version
        run: cargo check --locked --all-targets
