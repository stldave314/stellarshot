[package]
name = "stellarshot"
version = "0.8.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "A backup application for the COSMIC desktop, built on rustic"
repository = "https://github.com/stldave314/stellarshot"
homepage = "https://github.com/stldave314/stellarshot"
readme = "README.md"
keywords = ["cosmic", "backup", "restic", "rustic", "snapshot"]
categories = ["gui", "filesystem"]

[lib]
name = "stellarshot"
path = "src/lib.rs"

[[bin]]
name = "stellarshot"
path = "src/main.rs"

[[bin]]
name = "stellarshot-applet"
path = "src/bin/applet.rs"

[[bin]]
name = "stellarshot-web"
path = "src/bin/web.rs"

[features]
default = []
# Forces developer debug logging off at compile time. Every packaging target
# passes this so a release can never ship with logging enabled.
release-build = []
# Active for every `cargo test` binary, unit and integration alike, through
# the self-referential dev-dependency below. Lets library code behave
# differently only for its own tests without an env var or a runtime check
# that a real build would also pay for.
test-support = []

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
open = "5"
serde = { version = "1", features = ["derive"] }
rustic_core = "0.13"
# rustic's storage interface hands file contents over as `Bytes`.
bytes = "1"
# Matches rustic_core's own dependency, to build the `ByteSize` its exclusion
# and restore options take. Not re-exported, so the type only matches when
# this crate resolves to the same version rustic_core does.
bytesize = "2"
# The local backend is always built; rclone carries SFTP and cloud storage.
rustic_backend = { version = "0.7", default-features = false, features = ["rclone", "rest"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "process", "io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
jiff = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bridges `log` (what rustic_core and rustic_backend, including rclone's own
# output, actually log through) into the `tracing` subscriber above. Without
# it, `set_logger`'s own claim to route rustic's output was never true.
tracing-log = "0.2"
# Splits a password command the same way rustic_core splits its own
# stdin-command and rclone-command strings: into an argument list without
# invoking a real shell.
shell-words = "1"
thiserror = "2"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
ron = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
gethostname = "1"
# Downloading a folder straight from a snapshot, without restoring it:
# rustic's own `dump` only covers a single file, so a folder is Stellarshot's
# own tar archive built from a walk of the snapshot's tree. gzip-compressed
# (via `flate2`, already pulled in transitively) rather than rustic's own
# zstd, since a `.tar.gz` is the more widely recognized, more easily
# double-clicked archive format outside of a backup tool itself.
tar = "0.4"
flate2 = "1"
# Desktop notifications; already built for the keyring and the portals.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
# Stopping a backup together with the rclone process rustic starts under it.
rustix = { version = "1", features = ["process", "fs"] }
# Open-file-description locks (`fcntl(F_OFD_SETLK/F_OFD_GETLK)`) for the
# repository write lock: unlike `flock()` (what `std::fs::File::try_lock`
# uses) or classic per-process `fcntl` record locks (what `rustix::fs`
# exposes), OFD locks support querying whether a lock is held without ever
# taking it, which `engine::lock::is_running` needs to avoid racing a real
# write. Already pulled in transitively (through rustix's own optional
# `libc` backend and elsewhere); this is a direct dependency on the same
# version, not a second copy.
libc = "0.2"
# Writing a systemd unit file so it either has its old content or its new
# content after a crash, never empty or half-written: a plain `fs::write`
# has neither an atomic rename nor an fsync of the file or its directory
# before returning, so an unclean shutdown mid-write can leave a zero-byte
# unit file behind, which breaks that backup's schedule until re-saved.
# Already pulled in transitively by libcosmic; this is a direct dependency
# on the exact same fork and revision, not a second copy.
atomicwrites = { git = "https://github.com/jackpot51/rust-atomicwrites" }
# Mounting a snapshot as a read-only folder: rustic_core exposes no vfs or
# mount feature of its own (unlike the separate `rustic` CLI, which uses
# libfuse directly), so this is a small filesystem of Stellarshot's own,
# backed by the same `Browser` the restore page already reads through.
fuser = "0.18"
# Generating a web interface API token: high-entropy bytes, not a UUID
# (fewer bits, not meant as a secret).
rand = "0.10"
# The web interface's own HTTP server (`stellarshot-web`), on the same
# tokio runtime already used elsewhere. Already pulled in transitively
# (through libcosmic's own dependencies); these are direct dependencies on
# compatible versions, not a second copy.
axum = "0.8"
# Matching addresses and CIDR ranges in the web interface's IP allow-list.
ipnet = "2"
# Decoding the web interface's HTTP Basic credentials.
base64 = "0.23"
# Comparing the web interface's password and API token in constant time, so
# a network attacker gains nothing from how long a wrong guess took to
# reject. Already pulled in transitively; a direct dependency on the same
# version, not a second copy.
subtle = "2"
# A version pin, unlike every other entry, would need its own comment to
# justify; there is none, so this tracks the latest compatible `0.8`/`0.14`.
axum-server = { version = "0.8", features = ["tls-rustls"] }
# `TokioTimer`, for the header-read timeout and HTTP/2 keepalive on
# `axum_server::Server::http_builder()`'s own hyper connection builder, which
# has none by default. Already pulled in transitively through axum-server
# itself, at the same version; this is a direct dependency, not a second
# copy.
hyper-util = { version = "0.1", features = ["tokio"] }
# Delegating `AsyncRead`/`AsyncWrite` through the web interface's own
# accept-time allow-list/connection-cap wrapper without hand-written unsafe
# pin projection. Already pulled in transitively; a direct dependency on
# the same version, not a second copy.
pin-project-lite = "0.2"
# Two crypto providers would otherwise end up compiled in: `aws-lc-rs`
# (rustls's own default, and what axum-server actually uses at runtime) and
# `ring` (rcgen's own default). Installed explicitly as the one default
# provider at startup (`web::main`) so a future dependency enabling
# `rustls/ring` cannot make rustls unable to choose and panic; `rcgen` below
# is pinned off `ring` for the same reason. Already pulled in transitively
# through axum-server/tokio-rustls, at the same version; this is a direct
# dependency, not a second copy.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }
# `rcgen::CertificateParams`'s own `not_before`/`not_after` fields, for the
# web interface's self-signed certificate's validity period. Already
# pulled in transitively through rcgen itself, at the same version; this
# is a direct dependency, not a second copy.
time = "0.3"
# Reading a certificate file's DER bytes back out, for its SHA-256
# fingerprint shown in Settings. Already pulled in transitively through
# rustls itself, at the same version; this is a direct dependency, not a
# second copy.
rustls-pki-types = { version = "1", features = ["std"] }
# Per-request timeout, a body size cap, and fixed response headers
# (`X-Content-Type-Options`, `Cache-Control`, a strict CSP) for the web
# interface. Already pulled in transitively through axum's own dependency
# tree, at the same version; this is a direct dependency, not a second copy.
tower-http = { version = "0.7", features = ["timeout", "limit", "set-header"] }
# Wraps the repository password (`engine::Secret`) so it zeroizes on drop and
# its `Debug` is redacted by the crate itself, not by a hand-written impl that
# could rot if a new field were ever added without updating it too.
secrecy = { version = "0.10", features = ["serde"] }
# Wipes the job JSON buffer that carries the password across the `--run`
# child's stdin, after it is written: `secrecy` protects the `Secret` value
# itself, but the serialized bytes are a second, temporary copy outside its
# reach.
zeroize = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
# "applet" is only used by the stellarshot-applet binary, not the window;
# there is no per-binary feature selection in Cargo, so it is built into
# the same feature set. "single-instance" is the window's own: launching it
# again while it is already running (from the applet, or a second launcher
# click) raises the existing window instead of opening a second one, which
# "minimize to panel" depends on to be worth anything.
features = [
    "a11y",
    "about",
    "applet",
    "dbus-config",
    "multi-window",
    "process",
    "single-instance",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
    "xdg-portal",
]

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dev-dependencies]
# Self-referential: enables `test-support` for every test binary, unit and
# integration alike, without threading a feature flag through each one.
stellarshot = { path = ".", features = ["test-support"] }
tempfile = "3"
# Only to prove the `log`-to-`tracing` bridge in `app::settings::set_logger`
# actually forwards what rustic_core and rustic_backend log through it.
log = "0.4"
# Only to set and read extended attributes in tests; production xattr
# handling is entirely internal to rustic_core.
xattr = "1"
# Only to force a test file's modification time to collide with another's.
filetime = "0.2"
# Only to catch a Fluent syntax error (a dropped "junk" entry) that the
# hand-written key scanner in tests/i18n.rs cannot see on its own.
fluent-syntax = "0.12"

# Packaging. `install.sh` drives both of these; the `release-build` feature has
# to be passed to `cargo deb` explicitly because it runs its own build.
[package.metadata.deb]
# Deliberately the GitHub no-reply address, not a personal one.
maintainer = "stldave314 <stldave314@users.noreply.github.com>"
copyright = "2024-2026, the Stellarshot contributors"
license-file = ["LICENSE", "0"]
extended-description = """
A backup application for the COSMIC desktop. Stellarshot keeps encrypted,
deduplicated snapshots of your folders in a restic-compatible repository, so
your backups stay readable with the restic and rustic command-line tools."""
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "rclone, fuse3"
assets = [
    ["target/release/stellarshot", "usr/bin/", "755"],
    ["target/release/stellarshot-applet", "usr/bin/", "755"],
    ["target/release/stellarshot-web", "usr/bin/", "755"],
    ["res/io.github.stldave314.Stellarshot.desktop", "usr/share/applications/", "644"],
    ["res/io.github.stldave314.Stellarshot.Applet.desktop", "usr/share/applications/", "644"],
    ["res/icons/hicolor/scalable/apps/io.github.stldave314.Stellarshot.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["res/icons/hicolor/scalable/apps/io.github.stldave314.Stellarshot-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["docs/web-interface.md", "usr/share/doc/stellarshot/", "644"],
    ["res/io.github.stldave314.Stellarshot.metainfo.xml", "usr/share/metainfo/", "644"],
    ["README.md", "usr/share/doc/stellarshot/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "A backup application for the COSMIC desktop, built on rustic"
license = "GPL-3.0-only"
recommends = { rclone = "*", fuse3 = "*" }
assets = [
    { source = "target/release/stellarshot", dest = "/usr/bin/stellarshot", mode = "755" },
    { source = "target/release/stellarshot-applet", dest = "/usr/bin/stellarshot-applet", mode = "755" },
    { source = "target/release/stellarshot-web", dest = "/usr/bin/stellarshot-web", mode = "755" },
    { source = "res/io.github.stldave314.Stellarshot.desktop", dest = "/usr/share/applications/io.github.stldave314.Stellarshot.desktop", mode = "644" },
    { source = "res/io.github.stldave314.Stellarshot.Applet.desktop", dest = "/usr/share/applications/io.github.stldave314.Stellarshot.Applet.desktop", mode = "644" },
    { source = "res/icons/hicolor/scalable/apps/io.github.stldave314.Stellarshot.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.stldave314.Stellarshot.svg", mode = "644" },
    { source = "res/icons/hicolor/scalable/apps/io.github.stldave314.Stellarshot-symbolic.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.stldave314.Stellarshot-symbolic.svg", mode = "644" },
    { source = "res/io.github.stldave314.Stellarshot.metainfo.xml", dest = "/usr/share/metainfo/io.github.stldave314.Stellarshot.metainfo.xml", mode = "644" },
    { source = "docs/web-interface.md", dest = "/usr/share/doc/stellarshot/web-interface.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/stellarshot/LICENSE", mode = "644" },
]

[profile.release]
lto = "thin"
opt-level = 2
strip = true
codegen-units = 4
