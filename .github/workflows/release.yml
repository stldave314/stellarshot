# SPDX-License-Identifier: GPL-3.0-only
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: read

concurrency:
  # Never canceled mid-flight: an in-progress publish must finish rather than
  # leave a tag half-released.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Read-only: builds and tests the tagged commit and uploads the packages as
  # a workflow artifact. Only `publish`, below, holds `contents: write`, so a
  # `build.rs` anywhere in the dependency tree (including a git dependency)
  # never runs with a token that could push to this repository.
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # for actions/attest-build-provenance below
      attestations: write # ditto; neither one grants push access to the repo

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            desktop-file-utils appstream dbus gnome-keyring rclone rpm2cpio

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # `lookup-only: true`: a release build only ever reads a cache another
      # (branch) workflow run already produced, never writes one of its own.
      # A tag push is exactly the kind of run a cache-poisoning attack would
      # target to plant a cache entry a future run trusts.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deb,cargo-generate-rpm

      # The metainfo's newest release must be the version being shipped, or
      # software centers advertise an old version indefinitely.
      - name: Validate metadata
        run: ./scripts/validate-metadata.sh

      # tests/keyring.rs needs a real Secret Service and fails without one,
      # so the suite runs inside a private D-Bus session with an unlocked
      # gnome-keyring rather than skipping it.
      - name: Test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --all-features --locked
          '

      # A release must never ship with developer logging on, and that has to be
      # mechanical rather than remembered. install.sh passes the feature to
      # every packaging target; this proves the feature works.
      - name: Verify release-build strips debug logging
        run: ./scripts/verify-release-build.sh

      - name: Build all packages
        run: ./install.sh package

      # See ci.yml's own comment: proves the actual shipped files, not just
      # that the feature mechanism works in the abstract.
      - name: Verify the shipped packages strip debug logging
        run: ./scripts/verify-packaged-binaries-strip-logging.sh

      - name: List artifacts
        run: ls -lh dist/

      # A verifiable, signed record of exactly this GitHub Actions run
      # having produced these specific files, checkable with
      # `gh attestation verify` (documented in the README) against
      # tampering after the fact, not just against a wrong build.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.deb,dist/*.rpm,dist/*.tar.gz"

      # The release notes are the version's section of CHANGELOG.md, so the
      # release page says what changed rather than listing commits. A tag
      # with no section fails here instead of publishing an empty release.
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # The only job with `contents: write`, and the only one that touches
  # anything outside this run: it does not build anything itself, only
  # downloads what `build` already produced and tested.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only this job needs it, to create the GitHub release

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # `gh` is preinstalled on the runner, so this needs no third-party
      # action (and one fewer supply-chain dependency) for what is otherwise
      # a single API call.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            dist/*.deb dist/*.rpm dist/*.tar.gz
