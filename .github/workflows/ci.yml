# SPDX-License-Identifier: GPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A new advisory can land against an unchanged Cargo.lock; without this
  # `cargo deny` only ever runs when something else changes.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build, test and package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            dbus gnome-keyring rclone rpm2cpio cpio fuse3

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deb,cargo-generate-rpm,cargo-auditable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      # tests/keyring.rs needs a real Secret Service and fails without one,
      # so the suite runs inside a private D-Bus session with an unlocked
      # gnome-keyring rather than skipping it.
      - name: Test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --all-features --locked
          '

      # Proves the release feature really removes developer logging, instead of
      # trusting that the constant does what it says.
      - name: Verify release-build strips debug logging
        run: ./scripts/verify-release-build.sh

      # The same path the release workflow takes, so a packaging break shows up
      # on main rather than after a tag has been pushed.
      - name: Build packages
        run: ./install.sh package

      # verify-release-build.sh proves the mechanism (the feature strips the
      # constant); this proves the actual .deb/.rpm/.tar.gz in dist/ were
      # really built with it — a packaging target that forgot to pass the
      # feature would pass the other script without ever running.
      - name: Verify the shipped packages strip debug logging
        run: ./scripts/verify-packaged-binaries-strip-logging.sh

      - name: Inspect the .deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      # What the smoke test below installs: the very files built and
      # verified above, not a second build.
      - name: Keep the packages for the install test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Installing is the only proof a package installs: `dpkg-deb --contents`
  # shows a file list, not that the dependencies resolve, the binaries find
  # their libraries, or that removing it leaves nothing behind. Each leg
  # starts from a clean distribution image.
  package-smoke:
    name: Install the ${{ matrix.kind }} in a clean system
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:44
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Install the package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == deb ]]; then
            apt-get update
            apt-get install -y --no-install-recommends ./dist/*.deb lintian
            lintian --fail-on error dist/*.deb
          else
            dnf install -y ./dist/*.rpm
          fi

      # A missing shared library would only otherwise show up on a user's
      # machine. `ldd` reports it as "not found"; the usage error is the
      # binary starting far enough to parse its own arguments.
      - name: The binaries start
        shell: bash
        run: |
          set -euo pipefail
          for bin in stellarshot stellarshot-applet; do
            if ldd "/usr/bin/$bin" | grep -F 'not found'; then
              echo "$bin has unresolved libraries" >&2
              exit 1
            fi
          done
          status=0
          stellarshot --run no-such-operation </dev/null || status=$?
          test "$status" -eq 2

      - name: Remove the package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.kind }}" == deb ]]; then
            apt-get remove -y stellarshot
          else
            dnf remove -y stellarshot
          fi
          test ! -e /usr/bin/stellarshot
          test ! -e /usr/bin/stellarshot-applet

  # The portable tarball's own installer, run the way its README says: the
  # archive extracted by an ordinary user, then installed as root. That is
  # the path that once re-owned /usr to the extracting user.
  tarball-smoke:
    name: Install the tarball as root from a user's extraction
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist

      - name: Install, check ownership, uninstall
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          chmod -R a+rX dist
          su builder -c 'mkdir -p ~/x && tar -xzf "$PWD/dist/"*.tar.gz -C ~/x'
          dir=$(echo /home/builder/x/stellarshot-*)
          (cd "$dir" && ./install-tarball.sh)
          for path in /usr /usr/bin /usr/bin/stellarshot /usr/bin/stellarshot-applet; do
            owner=$(stat -c %U "$path")
            if [[ "$owner" != root ]]; then
              echo "$path is owned by $owner after the install" >&2
              exit 1
            fi
          done
          (cd "$dir" && ./install-tarball.sh uninstall)
          test ! -e /usr/bin/stellarshot

  metadata:
    name: Validate packaging metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: validate-metadata.sh checks every release has an entry
          persist-credentials: false

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            desktop-file-utils appstream

      # Shared with local runs so the two cannot drift. Every finding from
      # desktop-file-validate and appstreamcli is a hard failure; the script
      # is deliberately not a blanket `|| true`.
      - name: Validate desktop entry and AppStream metadata
        run: ./scripts/validate-metadata.sh

  # What the suite actually exercises, as a report to read, not a gate: a
  # line covered by a test that asserts nothing still counts. Same services
  # as `test`, so the numbers include the keyring and rclone tests.
  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            dbus gnome-keyring rclone fuse3

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: Measure
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
          '
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs offline (no GITHUB_TOKEN needed): the audits that need network
      # access are for public-repo posture checks this private-by-default
      # workflow set does not need.
      - name: Install zizmor
        run: pipx install zizmor==1.30.1

      - name: zizmor
        run: zizmor --min-severity medium .github/workflows

  deny:
    name: Advisories, licenses and sources
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # deny.toml's own comments explain every allow-list entry: which
      # license, which git source, which specific advisory ID, and why.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev

      # `rust-version` in Cargo.toml, kept at or above rustic_core's own
      # floor: this proves the crate actually still builds there, rather
      # than trusting the field is accurate.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check at the minimum supported Rust version
        run: cargo check --locked --all-targets
