# SPDX-License-Identifier: GPL-3.0-only
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build and publish packages
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            desktop-file-utils appstream dbus gnome-keyring rclone

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # The metainfo's newest release must be the version being shipped, or
      # software centres advertise an old version indefinitely.
      - name: Validate metadata
        run: ./scripts/validate-metadata.sh

      # tests/keyring.rs needs a real Secret Service and fails without one,
      # so the suite runs inside a private D-Bus session with an unlocked
      # gnome-keyring rather than skipping it.
      - name: Test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            cargo test --all-features
          '

      # A release must never ship with developer logging on, and that has to be
      # mechanical rather than remembered. install.sh passes the feature to
      # every packaging target; this proves the feature works.
      - name: Verify release-build strips debug logging
        run: ./scripts/verify-release-build.sh

      - name: Build all packages
        run: ./install.sh package

      - name: List artefacts
        run: ls -lh dist/

      # The release notes are the version's section of CHANGELOG.md, so the
      # release page says what changed rather than listing commits. A tag
      # with no section fails here instead of publishing an empty release.
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          body_path: release-notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
